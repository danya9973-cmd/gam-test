<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퇴근길 감 테스트 — 퇴근길 숫자, 당신의 감은 몇 점일까요?</title>
<meta name="description" content="공개 데이터로 만든 추측 게임. 10개 주제, 주제당 5문항.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="app">

  <!-- 주제 고르기 ──────────────────────────────── -->
  <section id="view-home" class="view">
    <div class="govbar"><span>공공데이터 활용</span><span>국민 감각 점검 안내</span></div>
    <p id="shared-banner" class="banner" hidden></p>
    <div class="hero">
      <div class="docmeta">
        <span class="badge-day">퇴근길 특별판</span>
        <span>문서번호 감테-제2026호</span>
      </div>
      <h1 id="title">퇴근길 감 테스트</h1>
      <p id="subtitle" class="muted"></p>
      <dl class="docinfo">
        <dt>대상</dt><dd>퇴근길 국민 누구나</dd>
        <dt>방법</dt><dd>주제 1건 선택 후 5문항 응답 (약 1분 소요)</dd>
        <dt>근거</dt><dd>공개 데이터 원본에서 직접 계산</dd>
      </dl>
      <span class="seal" aria-hidden="true">확인</span>
    </div>
    <h2 class="listhead">점검 주제 목록 <span id="progress-note"></span></h2>
    <div id="topic-grid" class="grid"></div>
    <div class="notice">
      <b>※ 유의사항</b>
      <p>모든 숫자는 공개 데이터에서 직접 계산했습니다.
        결과 화면의 <b>근거 보기</b>를 누르면 어떻게 셌는지 확인할 수 있습니다.</p>
    </div>
  </section>

  <!-- 문항 ───────────────────────────────────── -->
  <section id="view-quiz" class="view" hidden>
    <button id="btn-back" class="linkish">← 주제 고르기</button>
    <p id="topic-name" class="muted small"></p>
    <div class="progress"><div id="progress-bar"></div></div>
    <p id="q-count" class="muted small"></p>
    <h2 id="q-text"></h2>

    <div id="q-choice" class="choices" hidden></div>

    <div id="q-slider" hidden>
      <output id="slider-out" class="slider-out"></output>
      <input type="range" id="slider" aria-label="추측 값">
      <div class="slider-ends"><span id="slider-min"></span><span id="slider-max"></span></div>
    </div>

    <button id="btn-next" class="primary" disabled>다음</button>
  </section>

  <!-- 결과 ───────────────────────────────────── -->
  <section id="view-result" class="view" hidden>
    <p id="result-topic" class="muted small"></p>
    <div class="score-card">
      <div id="grade-emoji" class="grade-emoji"></div>
      <div id="score" class="score"></div>
      <div id="grade" class="grade"></div>
    </div>

    <div id="ai-comment" class="ai" hidden></div>

    <div id="cards"></div>

    <div id="caveat" class="caveat" hidden></div>
    <p id="source" class="fineprint"></p>

    <div class="actions">
      <button id="btn-share" class="primary">친구에게 보내기</button>
      <button id="btn-more" class="ghost">다른 주제 풀기</button>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
